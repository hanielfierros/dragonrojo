<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="SESPATE DEMO — Análisis de Información. Dashboard de inteligencia de negocios (datos ficticios).">
  <title>SESPATE — Análisis de Información</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./vendor/leaflet.css">
  <link rel="stylesheet" href="./css/analisis.css">
  <link rel="stylesheet" href="./css/componentes.css">
  <link rel="stylesheet" href="./css/responsive.css">
</head>
<body>
  <header class="brand-bar" role="banner">
    <div class="brand">
      <span class="brand-name">iData</span>
      <span class="brand-sep">·</span>
      <span class="brand-sub">SESPATE — ANÁLISIS DE INFORMACIÓN</span>
    </div>
    <div class="brand-spacer"></div>
    <span class="status-chip simulado" aria-label="Datos ficticios">DATOS FICTICIOS — DEMOSTRACIÓN</span>
    <button class="btn theme-toggle" type="button" id="themeToggle" aria-label="Cambiar tema">Tema</button>
  </header>

  <div class="app-shell">
    <aside class="side-nav" id="sideNav" aria-label="Navegación de módulos">
      <button class="nav-toggle" id="navToggle" type="button" aria-label="Abrir navegación">☰ Módulos</button>
      <nav class="nav-list" id="navList" aria-label="Módulos"></nav>
    </aside>

    <main class="main-area" id="mainArea">
      <section class="filter-region region" id="filterRegion" aria-label="Filtros globales">
        <div class="region-title">Filtros globales</div>
        <div class="region-body">
          <div class="filter-bar" id="filterBar"></div>
          <div class="filter-actions">
            <button class="btn primary" type="button" id="btnAplicar">Aplicar filtros</button>
            <button class="btn" type="button" id="btnLimpiar">Limpiar filtros</button>
          </div>
          <div class="filter-summary" id="filterSummary" aria-live="polite"></div>
        </div>
      </section>

      <section class="module-area" id="moduleArea" aria-live="polite">
        <div class="state-msg" id="estadoCarga">Cargando datos…</div>
      </section>
    </main>
  </div>

  <footer class="app-footer">© iData · Departamento de Ingeniería Aeronáutica Aplicada — DATOS FICTICIOS — DEMOSTRACIÓN</footer>

  <script src="./vendor/leaflet.js"></script>
  <script src="./vendor/echarts.min.js"></script>
  <script type="module" src="./js/app.js"></script>
</body>
</html>
